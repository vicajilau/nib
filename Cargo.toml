[package]
name = "nib"
version = "0.1.0"
edition = "2021"
authors = ["Victor C. <34163765+vicajilau@users.noreply.github.com>"]
description = "Connect your Android tablet as an external display with touch & stylus support in GNOME"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"

# Async & Networking for USB ADB transport
tokio = { version = "1.38", features = ["full"] }
async-channel = "2.3"
futures-util = "0.3"

# D-Bus IPC for Mutter / Freedesktop Portals
serde = { version = "1.0", features = ["derive"] }
zbus = "5.0"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }

# Audio/Video & Screen capture pipeline
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-app = "0.25"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"

# System Tray / StatusNotifierItem
ksni = { version = "0.3", features = ["blocking"] }
