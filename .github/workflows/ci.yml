name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  flutter:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nib_client
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check for untranslated messages
        run: |
          flutter gen-l10n
          content=$(cat untranslated_messages.json)
          if [ "$content" = "{}" ]; then
            echo "All translations are complete."
          else
            echo "Found untranslated messages:"
            cat untranslated_messages.json
            echo "Add the missing translations to the corresponding .arb files."
            exit 1
          fi

      - name: Test
        run: flutter test
