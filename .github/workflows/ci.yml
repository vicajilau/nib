name: CI

on:
  push:
    branches: [main]
    # Release tags too, so the version and packaging checks below run against the tag
    # itself, which is the moment they actually matter.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Rust host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            pkg-config \
            meson \
            ninja-build \
            desktop-file-utils \
            appstream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --verbose

      # Runs the desktop-file-validate and appstreamcli checks meson already declares, which
      # nothing executed before. --no-rebuild skips the cargo-build target: neither test needs
      # the binary, and the release build the flatpak job already does would be duplicated here.
      - name: Validate desktop entry and AppStream metadata
        run: |
          meson setup _build
          meson test -C _build --no-rebuild --print-errorlogs

  flutter:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nib_client
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check for untranslated messages
        run: |
          flutter gen-l10n
          content=$(cat untranslated_messages.json)
          if [ "$content" = "{}" ]; then
            echo "All translations are complete."
          else
            echo "Found untranslated messages:"
            cat untranslated_messages.json
            echo "Add the missing translations to the corresponding .arb files."
            exit 1
          fi

      - name: Test
        run: flutter test

  flatpak:
    name: Flatpak manifest
    runs-on: ubuntu-latest
    # This image is built FROM ghcr.io/flathub/flatpak-builder-lint, so the linter
    # binary is already on PATH here too - no separate container/job needed for it.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # cargo-sources.json is generated from Cargo.lock, and nothing regenerates it when a
      # dependency moves, so every Dependabot bump silently desynchronises the two. Catching
      # it here takes a second and names the crates; letting the build catch it costs minutes
      # and surfaces as cargo's "perhaps a crate was updated and forgotten to be re-vendored?".
      - name: Check cargo-sources.json is in sync with Cargo.lock
        run: ./build-aux/cargo-sources.py --check

      # v0.1.1 and v0.1.2 were both tagged while Cargo.toml, meson.build and the metainfo all
      # still said 0.1.0, so the released app reported the wrong version in its About dialog
      # and AppStream listed no release for either tag. On a tag push this compares every
      # declaration against the tag itself.
      - name: Check version declarations agree
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ./build-aux/check-versions.py --expect "${GITHUB_REF_NAME#v}"
          else
            ./build-aux/check-versions.py
          fi

      - name: Lint manifest (same checks Flathub's own review bot runs)
        run: flatpak-builder-lint manifest dev.victorcarreras.Nib.json

      # The checked-in manifest pins the "nib" module to the last tagged release, so
      # Flathub always builds something reproducible. For CI, point that same module
      # at the commit actually being tested, so a build failure is caught before it's
      # ever tagged. Uses python3, not jq, since it's guaranteed present here (the
      # linter itself is written in Python).
      - name: Point manifest at the commit under test
        run: |
          python3 -c "
          import json
          with open('dev.victorcarreras.Nib.json') as f:
              manifest = json.load(f)
          for module in manifest['modules']:
              if module.get('name') == 'nib':
                  module['sources'][0] = {
                      'type': 'git',
                      'url': 'https://github.com/${{ github.repository }}.git',
                      'commit': '${{ github.sha }}',
                  }
          with open('dev.victorcarreras.Nib.ci.json', 'w') as f:
              json.dump(manifest, f, indent=4)
          "

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: dev.victorcarreras.Nib.ci.json
          cache-key: flatpak-builder-${{ github.sha }}
          bundle: nib.flatpak
          build-bundle: false
